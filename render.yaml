services:
  - type: web
    name: hotel-api-staging
    runtime: docker
    plan: free
    repo: https://github.com/777Nebyu/hotel_system
    branch: main
    dockerfilePath: ./apps/api/Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: "15m"
      - key: JWT_REFRESH_TTL
        value: "7d"
      - key: WEB_ORIGIN
        value: "http://localhost:3000"