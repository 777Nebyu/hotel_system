packages:
  - "apps/*"
  - "packages/*"

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - "@prisma/engines-version"
  - "bcrypt"
  - "prisma"
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  bcrypt: true
  prisma: true
  sharp: false
  unrs-resolver: false
